# Baker configuration file
# This file controls how Baker builds the Biscuits kernel and BlueyOS system.

# Target architecture — biscuits defaults to i386
arch: i386

# Primary libc used for the bootable userland. Additional libc bootstrap
# components can still be built as recipes.
libc: musl-blueyos

# Path to the kernel source tree (fetched/updated during prepare)
kernel_source: src/biscuits

# Sysroot path: everything gets installed here before packaging
sysroot: sysroot

# Output directory for packages and images
output_dir: output

# Temporary build directory
build_dir: build

# Sources directory (where repos are checked out)
sources_dir: src

# Directory to copy finished .dpk packages into (so you can inspect what was built)
core_packages_dir: core

# Path to an installed musl-blueyos sysroot used to build userland components.
# Leave empty to auto-detect (/opt/blueyos-sysroot if present, else build/musl).
musl_prefix: ""

# Path where the staged glibc-blueyos install image is produced.
glibc_prefix: build/glibc-root/i686-pc-blueyos

# Path where the cross-compiler toolchain will be installed
toolchain_prefix: build/toolchains/i686-elf

# Logging level: debug, info, warning, error
log_level: info

# Kernel build options
kernel:
  config: ""              # Path to kernel .config (relative to kernel_source). Empty = use upstream default.
  make_flags: "-j4"       # Extra flags to pass to make
  install_modules: false  # biscuits does not use Linux-style modules

# Network configuration used during prepare (fetching sources)
network:
  kernel_repo: "https://github.com/nzmacgeek/biscuits"
  kernel_branch: "fix/waitpid-wuntraced"
  musl_blueyos_repo: "https://github.com/nzmacgeek/musl-blueyos"
  musl_blueyos_branch: "main"
  glibc_blueyos_repo: "https://github.com/nzmacgeek/glibc-blueyos"
  glibc_blueyos_branch: "master"
  dimsim_repo: "https://github.com/nzmacgeek/dimsim"
  dimsim_branch: "main"
  package_repos:
    - name: claw
      url: "https://github.com/nzmacgeek/claw"
      branch: "main"
    - name: yap
      url: "https://github.com/nzmacgeek/yap"
      branch: "main"
    - name: matey
      url: "https://github.com/nzmacgeek/matey"
      branch: "main"
    - name: blueyos-bash
      url: "https://github.com/nzmacgeek/blueyos-bash"
      branch: "main"
    - name: blueyos-tzinfo
      url: "https://github.com/nzmacgeek/blueyos-tzinfo"
      branch: "main"
    - name: blueyos-base
      url: "https://github.com/nzmacgeek/blueyos-base"
      branch: "main"
    - name: login-tools
      url: "https://github.com/nzmacgeek/login-tools"
      branch: "master"
    - name: walkies
      url: "https://github.com/nzmacgeek/walkies"
      branch: "main"
    - name: blueyos-archiving-tools
      url: "https://github.com/nzmacgeek/blueyos-archiving-tools"
      branch: "main"
    - name: scout
      url: "https://github.com/nzmacgeek/scout"
      branch: "main"
  extra_repos: []

# Components to include in the build (order matters for display; deps are resolved automatically)
components:
  - name: musl-blueyos
    enabled: true
  - name: glibc-blueyos
    enabled: true
  - name: dimsim
    enabled: true
  - name: claw
    enabled: true
  - name: yap
    enabled: true
  - name: matey
    enabled: true
  - name: ncurses
    enabled: true
  - name: readline
    enabled: true
  - name: bash
    enabled: true
  - name: blueyos-tzinfo
    enabled: true
  - name: blueyos-base
    enabled: true
  - name: login-tools
    enabled: true
  - name: walkies
    enabled: true
  - name: blueyos-archiving-tools
    enabled: true
  - name: scout
    enabled: true

# Components to explicitly exclude from the build
exclude: []

# Image output options
image:
  enabled: true
  format: disk      # biscuits natively produces a BlueyFS disk image via make disk
  size_mb: 64
  output: output/blueyos-disk.img
  bootloader: grub
  swap_mb: 64       # swap partition size in the disk image
  headroom_pct: 30  # extra storage headroom above installed content (%)

# VM launch options (used by 'baker vm')
vm:
  ram_mb: 512           # RAM to give the VM
  cpus: 2               # virtual CPU count
  display: gtk         # none (headless/serial) | gtk (graphical window)
  kvm: auto             # auto (use if /dev/kvm available) | enabled | disabled
  snapshot: false       # false = persistent (disk writes survive; use for diagnostics)
  extra_args: []        # additional qemu-system-i386 arguments
